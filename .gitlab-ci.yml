stages:
  - build
  - test_matrix
  - test_responsefunction
  - test
  - deploy

build-job:
  stage: build
  variables:
   FF_POSIXLY_CORRECT_ESCAPES: "true"
  script:
  - set -x
  - echo "Start"
  - export LANG=en_US.utf8
  - export LC_ALL=en_US.utf8
  - module load intel/2019
  - echo "current working directory $(pwd) "
  - icc LuaInterface/main.cpp -D LUA_USE_LINUX -O2 -ipo -xhost -static -qopenmp -I"${MKLROOT}/include" -Wl,--start-group ${MKLROOT}/lib/intel64/libmkl_intel_lp64.a ${MKLROOT}/lib/intel64/libmkl_intel_thread.a ${MKLROOT}/lib/intel64/libmkl_core.a -Wl,--end-group -liomp5 -lpthread -lm -ldl -o Quanty.exe
  artifacts:
    paths:
    - Quanty.exe
    expire_in: 1 week

sync_to_public:
  stage: deploy
  script:
    - echo "$SYNC_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H git.quanty.org >> ~/.ssh/known_hosts
    - git remote add public git@git.quanty.org:QuantyTest/quantytest.git
    - git push public develop:develop
  only:
    - develop

