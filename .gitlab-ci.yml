build-job:
  stage: build
  variables:
   FF_POSIXLY_CORRECT_ESCAPES: "true"
  script:
  - set -x
  - echo "Start"
  - export LANG=en_US.utf8
  - export LC_ALL=en_US.utf8
  - module load intel/2019
  - echo "current working directory $(pwd) "
  - icc LuaInterface/main.cpp -D LUA_USE_LINUX -O3 -ipo -xhost -static -qopenmp -I"${MKLROOT}/include" -Wl,--start-group ${MKLROOT}/lib/intel64/libmkl_intel_lp64.a ${MKLROOT}/lib/intel64/libmkl_intel_thread.a ${MKLROOT}/lib/intel64/libmkl_core.a -Wl,--end-group -liomp5 -lpthread -lm -ldl -o Quanty.exe
  artifacts:
    paths:
    - Quanty.exe
    expire_in: 1 week


# =========================================================================
# ===== Test single functions acting on different objects
# ===== These functions are registered in ssp.cpp 
