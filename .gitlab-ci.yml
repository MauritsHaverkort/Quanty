# =========================================================================
# ===== Test functions related to Math
# ===== These functions are registered in lmathlib.c and an extention of the standard lua math library
#

test-jobs-math:
  stage: test_math
  parallel:
    matrix:
      - TEST_NAME:
          - "GaussLegendreQuadrature"
          - "SphericalHarmonics"
  script:
    - export OMP_NUM_THREADS=8
    - ./Quanty.exe "TestScripts/Math/${TEST_NAME}.Quanty"
  dependencies:
    - build-job


