stages:
  - build
  - test_math
  - test_matrix
  - test_plot
  - test_responsefunction
  - test_tightbinding
  - test
  - deploy

build-job:
  stage: build
  variables:
   FF_POSIXLY_CORRECT_ESCAPES: "true"
  script:
    - set -x
    - echo "Start"
    - export LANG=en_US.utf8
    - export LC_ALL=en_US.utf8
    - module load intel/2021
    - echo "current working directory $(pwd)"
    - icpx LuaInterface/main.cpp -D LUA_USE_LINUX -O2 -fp-model=precise -fimf-precision=high -ipo -march=core-avx2 -static-intel -qopenmp -I"${MKLROOT}/include" -Wl,--start-group "${MKLROOT}/lib/intel64/libmkl_intel_lp64.a" "${MKLROOT}/lib/intel64/libmkl_sequential.a" "${MKLROOT}/lib/intel64/libmkl_core.a" -Wl,--end-group -lpthread -lm -ldl -o Quanty.exe
  artifacts:
    paths:
    - Quanty.exe
    expire_in: 1 week

sync_develop_to_public:
  stage: deploy
  variables:
    GIT_DEPTH: "0"
  script:
    - git push "https://git:${QuantyBotDevelop}@git.quanty.org/Quanty/develop.git" "${CI_COMMIT_SHA}:refs/heads/main"
  rules:
    - if: '$IS_PRIVATE_REPO == "true" && $CI_COMMIT_BRANCH == "develop"'

sync_release_to_public:
  stage: deploy
  variables:
    GIT_DEPTH: "0"
  script:
    - git push "https://git:${QuantyBotRelease}@git.quanty.org/Quanty/release.git" "${CI_COMMIT_SHA}:refs/heads/main"
  rules:
    - if: '$IS_PRIVATE_REPO == "true" && $CI_COMMIT_BRANCH == "master"'



